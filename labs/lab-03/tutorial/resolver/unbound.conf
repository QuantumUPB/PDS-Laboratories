server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 172.30.88.0/24 allow
    use-syslog: no
    logfile: ""
    verbosity: 1
    extended-statistics: yes
    prefetch: no
    serve-expired: no
    cache-min-ttl: 0
    cache-max-ttl: 3600
    username: ""
    chroot: ""

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

# A forwarding caching resolver, rather than direct root recursion.
# Outbound DNS (UDP/TCP port 53) must be permitted by your network.
forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 9.9.9.9

