# Serve only DHCP. Do not run dnsmasq's own DNS resolver.
port=0
interface=eth0
bind-interfaces
dhcp-authoritative
log-dhcp

# Keep this pool separate from Docker's IPAM pool.
dhcp-range=172.30.88.100,172.30.88.150,255.255.255.0,10m
# The Docker network gateway, not this DHCP server, is the router.
dhcp-option=option:router,172.30.88.1

# Final task: advertise Unbound (172.30.88.11) using DHCP option 6.
# Add the required option yourself.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
