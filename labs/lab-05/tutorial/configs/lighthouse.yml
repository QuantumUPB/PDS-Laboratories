pki:
  ca: /etc/nebula/creds/ca.crt
  cert: /etc/nebula/creds/host.crt
  key: /etc/nebula/creds/host.key
  blocklist: []
  disconnect_invalid: true

lighthouse:
  am_lighthouse: true
  interval: 60

listen:
  host: 0.0.0.0
  port: 4242

tun:
  dev: nebula1

firewall:
  outbound:
    - port: any
      proto: any
      host: any
  inbound:
    - port: any
      proto: icmp
      host: any
