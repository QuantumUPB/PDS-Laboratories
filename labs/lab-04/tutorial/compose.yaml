name: pds-lab04

services:
  silo:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: labadmin
      MINIO_ROOT_PASSWORD: labsecret123
    volumes:
      - silo_data:/data
      - ./files:/lab-files:ro
    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"

volumes:
  silo_data:

