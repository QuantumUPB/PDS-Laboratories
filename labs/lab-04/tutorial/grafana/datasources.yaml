apiVersion: 1

datasources:
  - name: OpenSearch
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    jsonData:
      flavor: opensearch
      version: "3.9.0"
      database: lab-logs
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
